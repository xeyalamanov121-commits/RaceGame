<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bearbee Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{margin:0;padding:0;font-family:'Segoe UI',sans-serif;background:#0a0f1a;color:#fff;}
.container{max-width:1300px;margin:0 auto;padding:16px;}
h1{color:#ffd700;text-align:center;margin-bottom:20px;}
.panel{background:#121a2a;border-radius:20px;padding:20px;margin-bottom:20px;box-shadow:0 0 15px rgba(255,215,0,0.1);}
.panel-title{color:#ffd700;font-size:22px;margin-bottom:12px;text-align:center;}
.history-item{background:#1c2536;padding:12px;border-radius:12px;margin-bottom:10px;}
.loader{color:#ffd700;font-weight:800;padding:20px;text-align:center;}
.btn{padding:8px 14px;border-radius:8px;color:#fff;cursor:pointer;border:none;margin-right:6px;margin-top:6px;}
.btn-green{background:#28a745;}
.btn-red{background:#dc3545;}
table{width:100%;border-collapse:collapse;margin-top:12px;}
th,td{padding:10px;border:1px solid #263f5d;text-align:center;}
th{background:#1c2536;color:#ffd700;}
td{background:#131b2b;color:#00d4ff;}
</style>

</head>
<body>

<div class="container">
  <h1>💎 Bearbee Admin Panel</h1>

  <section class="panel">
    <h2 class="panel-title">Pending Deposits</h2>
    <div id="depositHistory" class="loader">Yüklənir...</div>
  </section>

  <section class="panel">
    <h2 class="panel-title">Pending Withdrawals</h2>
    <div id="withdrawHistory" class="loader">Yüklənir...</div>
  </section>

  <section class="panel">
    <h2 class="panel-title">User Statistics</h2>
    <div id="userStats" class="loader">Yüklənir...</div>
  </section>

</div>

<script>
// ————————————————————————————————
// 👇 Supabase bağlantısı (sənin verdiyin dəyərlərlə)
// ————————————————————————————————
const SUPABASE_URL = "https://tddvicvdndrckoiynbay.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRkZHZpY3ZkbmRyY2tvaXluYmF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MjU2MDgsImV4cCI6MjA5NTMwMTYwOH0.jOsCfq1dgFI7zv--B6xF_u7YrsSWHFamxrLFNFMc2mg";

const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ————————————————————————————————
// 👇 Telegram MiniApp ilə istifadəçi yoxlaması
// ————————————————————————————————
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
const telegramUser = tg?.initDataUnsafe?.user || null;

// 🤖 Sənin admin ID‑ni yaz
const ADMIN_TELEGRAM_ID = 8591374417;

function isAdmin() {
  return telegramUser && Number(telegramUser.id) === ADMIN_TELEGRAM_ID;
}

// ————————————————————————————————
// 👇 Render funksiyaları
// ————————————————————————————————
function renderDeposits(list){
  const container = document.getElementById("depositHistory");
  container.innerHTML = "";
  if(!list.length){
    container.innerHTML = "<div>Pending deposit yoxdur.</div>"; return;
  }
  list.forEach(d => {
    const div = document.createElement("div");
    div.className = "history-item";
    div.innerHTML = `
      <b>#${d.id}</b> — TON: ${d.ton_amount}, Coin: ${d.coin_amount}<br>
      TX: ${d.tx_hash||"-"}<br>
      Status: ${d.status}<br>
      <button class="btn btn-green" onclick="approveDeposit(${d.id})">Approve</button>
      <button class="btn btn-red" onclick="rejectDeposit(${d.id})">Reject</button>
    `;
    container.appendChild(div);
  });
}

function renderWithdrawals(list){
  const container = document.getElementById("withdrawHistory");
  container.innerHTML = "";
  if(!list.length){
    container.innerHTML = "<div>Pending withdraw yoxdur.</div>"; return;
  }
  list.forEach(w => {
    const div = document.createElement("div");
    div.className = "history-item";
    div.innerHTML = `
      <b>#${w.id}</b> — Coin: ${w.coin_amount}, TON: ${w.ton_amount}<br>
      Wallet: ${w.wallet_address}<br>
      Status: ${w.status}<br>
      <button class="btn btn-green" onclick="markWithdrawPaid(${w.id})">Mark Paid</button>
      <button class="btn btn-red" onclick="rejectWithdraw(${w.id})">Reject</button>
    `;
    container.appendChild(div);
  });
}

function renderUserStats(list){
  const container = document.getElementById("userStats");
  container.innerHTML = "";
  if(!list.length){
    container.innerHTML = "<div>İstifadəçi yoxdur.</div>"; return;
  }
  const table = document.createElement("table");
  table.innerHTML = `
    <tr>
      <th>Telegram ID</th>
      <th>TON Balansı</th>
      <th>Coin Balansı</th>
    </tr>
  `;
  list.forEach(u => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${u.telegram_id}</td>
      <td>${u.ton_balance}</td>
      <td>${u.coin_balance}</td>
    `;
    table.appendChild(tr);
  });
  container.appendChild(table);
}

// ————————————————————————————————
// 👇 Admin paneli yükləmə
// ————————————————————————————————
async function loadAdminPanel(){
  if(!isAdmin()){
    alert("Siz admin deyilsiniz!");
    return;
  }

  try {
    const [depositsRes, withdrawalsRes, usersRes] = await Promise.all([
      supabase.from('deposits').select('*').eq('status','Pending'),
      supabase.from('withdrawals').select('*').eq('status','Pending'),
      supabase.from('wallets').select('*')
    ]);

    renderDeposits(depositsRes.data || []);
    renderWithdrawals(withdrawalsRes.data || []);
    renderUserStats(usersRes.data || []);

  } catch(error) {
    document.getElementById("depositHistory").innerText = "Yükləmə xətası: " + error.message;
  }
}

// ————————————————————————————————
// 👇 RPC funksiyaları — Approve / Reject / Paid
// ————————————————————————————————
async function approveDeposit(id){
  await supabase.rpc('admin_approve_deposit',{request_id:id});
  loadAdminPanel();
}

async function rejectDeposit(id){
  await supabase.rpc('admin_reject_deposit',{request_id:id});
  loadAdminPanel();
}

async function markWithdrawPaid(id){
  await supabase.rpc('admin_mark_withdrawal_paid',{request_id:id});
  loadAdminPanel();
}

async function rejectWithdraw(id){
  await supabase.rpc('admin_reject_withdrawal',{request_id:id});
  loadAdminPanel();
}

// ————————————————————————————————
// 👇 Paneli başlat
// ————————————————————————————————
loadAdminPanel();

</script>
</body>
</html>
