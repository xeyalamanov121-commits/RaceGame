<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bearbee Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{margin:0;padding:0;font-family:sans-serif;background:#111;color:#fff;}
.page{max-width:800px;margin:0 auto;padding:20px;}
.panel{background:#222;border-radius:12px;padding:15px;margin-bottom:15px;}
.panel h2{color:#ffd700;font-size:20px;margin-bottom:10px;}
.empty{color:#888;text-align:center;padding:10px;}
.request-card{background:#333;padding:10px;margin-bottom:10px;border-radius:8px;}
textarea{width:100%;padding:8px;border-radius:6px;background:#222;color:#fff;border:none;margin-top:6px;}
.btn{display:inline-block;padding:8px 12px;border-radius:6px;color:#fff;text-decoration:none;margin-top:6px;cursor:pointer;}
.btn-green{background:#28a745;}
.btn-red{background:#dc3545;}
.btn-gold{background:#ffc107;color:#111;}
.log{background:#111;padding:8px;border-radius:6px;color:#0f0;margin-top:6px;}
</style>
</head>
<body>
<main class="page">

<div id="loginPanel" class="panel">
<h2>Telegram ID yoxlanır</h2>
<div class="log" id="loginLog">Telegram Mini App məlumatı yoxlanılır...</div>
</div>

<div id="adminPanel" style="display:none">
  <div class="panel">
    <h2>Pending Deposits</h2>
    <div id="depositList" class="request-list"><div class="empty">Yüklənir...</div></div>
    <div class="log" id="depositLog"></div>
  </div>

  <div class="panel">
    <h2>Pending Withdrawals</h2>
    <div id="withdrawList" class="request-list"><div class="empty">Yüklənir...</div></div>
    <div class="log" id="withdrawLog"></div>
  </div>

  <div class="panel">
    <h2>Pending TON Card Orders</h2>
    <div id="tonOrderList" class="request-list"><div class="empty">Yüklənir...</div></div>
    <div class="log" id="tonOrderLog"></div>
  </div>
</div>

<button class="btn btn-gold" onclick="loadPending()">Yenilə</button>

</main>

<script>
const SUPABASE_URL = "https://tddvicvdndrckoiynbay.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...";
const ADMIN_TELEGRAM_ID = 8591374417;

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const loginPanel = document.getElementById("loginPanel");
const adminPanel = document.getElementById("adminPanel");
const loginLog = document.getElementById("loginLog");
const depositList = document.getElementById("depositList");
const withdrawList = document.getElementById("withdrawList");
const tonOrderList = document.getElementById("tonOrderList");
const depositLog = document.getElementById("depositLog");
const withdrawLog = document.getElementById("withdrawLog");
const tonOrderLog = document.getElementById("tonOrderLog");

const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();
const telegramUser = tg?.initDataUnsafe?.user || null;

function denyAccess(msg){
  loginPanel.style.display="block";
  adminPanel.style.display="none";
  loginLog.innerText="⛔ Giriş qadağandır. " + msg;
}

function isAdminTelegram(){
  return telegramUser && Number(telegramUser.id) === ADMIN_TELEGRAM_ID;
}

function showAdmin(){ loginPanel.style.display="none"; adminPanel.style.display="block"; }

async function startAdmin(){
  if(!telegramUser){ denyAccess("Bot içindən aç."); return; }
  if(!isAdminTelegram()){ denyAccess("Sənin ID admin deyil: " + telegramUser.id); return; }
  loginLog.innerText="✅ Admin tanındı. Telegram ID: " + telegramUser.id;
  showAdmin();
  await loadPending();
}

async function loadPending(){
  try{
    showAdmin();
    depositLog.innerText="Yüklənir...";
    withdrawLog.innerText="Yüklənir...";
    tonOrderLog.innerText="Yüklənir...";

    // Deposits
    const {data: deposits, error: depErr} = await supabaseClient
      .from('deposits')
      .select('*')
      .eq('status','Pending');
    renderDeposits(deposits || []);
    depositLog.innerText= depErr ? "Xəta: " + depErr.message : "Depositlər yükləndi.";

    // Withdrawals
    const {data: withdrawals, error: witErr} = await supabaseClient
      .from('withdrawals')
      .select('*')
      .eq('status','Pending');
    renderWithdrawals(withdrawals || []);
    withdrawLog.innerText= witErr ? "Xəta: " + witErr.message : "Withdraw-lar yükləndi.";

    // TON Card Orders
    const {data: tonOrders, error: tonErr} = await supabaseClient
      .from('ton_card_orders')
      .select('*')
      .eq('status','Pending');
    renderTonCardOrders(tonOrders || []);
    tonOrderLog.innerText= tonErr ? "Xəta: " + tonErr.message : "TON kart order-ləri yükləndi.";

  }catch(e){
    depositLog.innerText="Yükləmə xətası: " + e.message;
    withdrawLog.innerText="Yükləmə xətası: " + e.message;
    tonOrderLog.innerText="Yükləmə xətası: " + e.message;
  }
}

// --- Render funksiyaları ---
function renderDeposits(list){
  depositList.innerHTML="";
  if(!list.length){ depositList.innerHTML='<div class="empty">Pending deposit yoxdur.</div>'; return; }
  list.forEach(item=>{
    const div = document.createElement("div"); div.className="request-card";
    div.innerHTML=`<b>Deposit #${item.id}</b><br>User ID: ${item.telegram_id}<br>TON: ${item.ton_amount}<br>Coin: ${item.coin_amount}<br>TX: ${item.tx_hash}<br>Status: ${item.status}<br><textarea placeholder="Admin qeyd"></textarea><button class="btn btn-green">Approve</button><button class="btn btn-red">Reject</button>`;
    const approveBtn = div.querySelector('.btn-green');
    approveBtn.addEventListener('click', async ()=>{
      const note = div.querySelector('textarea').value;
      await supabaseClient.rpc('admin_approve_deposit', {request_id:item.id, p_admin_note:note});
      div.remove();
    });
    const rejectBtn = div.querySelector('.btn-red');
    rejectBtn.addEventListener('click', async ()=>{
      const note = div.querySelector('textarea').value;
      await supabaseClient.rpc('admin_reject_deposit', {request_id:item.id, p_admin_note:note});
      div.remove();
    });
    depositList.appendChild(div);
  });
}

function renderWithdrawals(list){
  withdrawList.innerHTML="";
  if(!list.length){ withdrawList.innerHTML='<div class="empty">Pending withdraw yoxdur.</div>'; return; }
  list.forEach(item=>{
    const div = document.createElement("div"); div.className="request-card";
    div.innerHTML=`<b>Withdraw #${item.id}</b><br>User ID: ${item.telegram_id}<br>Wallet: ${item.wallet_address}<br>Coin: ${item.coin_amount}<br>Fee: ${item.fee_coin_amount}<br>Receive Coin: ${item.receive_coin_amount}<br>TON: ${item.ton_amount}<br>Status: ${item.status}<br><textarea placeholder="Admin qeyd"></textarea><button class="btn btn-green">Mark Paid</button><button class="btn btn-red">Reject</button>`;
    div.querySelector('.btn-green').addEventListener('click', async ()=>{
      const note = div.querySelector('textarea').value;
      await supabaseClient.rpc('admin_mark_withdrawal_paid', {request_id:item.id, p_admin_note:note});
      div.remove();
    });
    div.querySelector('.btn-red').addEventListener('click', async ()=>{
      const note = div.querySelector('textarea').value;
      await supabaseClient.rpc('admin_reject_withdrawal', {request_id:item.id, p_admin_note:note});
      div.remove();
    });
    withdrawList.appendChild(div);
  });
}

function renderTonCardOrders(list){
  tonOrderList.innerHTML="";
  if(!list.length){ tonOrderList.innerHTML='<div class="empty">Pending TON kart order yoxdur.</div>'; return; }
  list.forEach(item=>{
    const div = document.createElement("div"); div.className="request-card";
    div.innerHTML=`<b>TON Card Order #${item.id}</b><br>Buyer ID: ${item.buyer_telegram_id}<br>Card: ${item.card_name}<br>Amount: ${item.amount_ton} TON<br>Wallet: ${item.pay_to_wallet}<br>Status: ${item.status}<br><textarea placeholder="Admin qeyd"></textarea><button class="btn btn-green">Approve</button><button class="btn btn-red">Reject</button>`;
    div.querySelector('.btn-green').addEventListener('click', async ()=>{
      const note = div.querySelector('textarea').value;
      await supabaseClient.rpc('admin_approve_ton_card_order', {order_id:item.id, p_admin_note:note});
      div.remove();
    });
    div.querySelector('.btn-red').addEventListener('click', async ()=>{
      const note = div.querySelector('textarea').value;
      await supabaseClient.rpc('admin_reject_ton_card_order', {order_id:item.id, p_admin_note:note});
      div.remove();
    });
    tonOrderList.appendChild(div);
  });
}

startAdmin();
</script>
</body>
</html>
