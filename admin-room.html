<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Bearbee Arena | Admin Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; padding: 15px; }
        .card { background: #111; border: 1px solid #333; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .item { border-bottom: 1px solid #222; padding: 10px 0; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
        .btn-g { background: #ffd700; color: #000; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="color:#ffd700">Real İstifadəçi Depozitləri</h2>
    <div id="userDeposits"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
    const config = { databaseURL: "https://racegane-default-rtdb.asia-southeast1.firebasedatabase.app" };
    firebase.initializeApp(config);
    const rdb = firebase.database();

    // 1. İSTİFADƏÇİLƏRİN 'deposits' QOVLUĞUNU SKAN ET
    rdb.ref('users').on('value', (s) => {
        const users = s.val() || {};
        const container = document.getElementById("userDeposits");
        container.innerHTML = "";
        
        Object.keys(users).forEach(uid => {
            const user = users[uid];
            if (user.deposits) {
                Object.keys(user.deposits).forEach(depKey => {
                    const dep = user.deposits[depKey];
                    // Yalnız 'pending' (gözləyən) sorğuları çıxar
                    if(dep.status === "pending") {
                        container.innerHTML += `
                        <div class="item">
                            <span>ID: <b>${dep.user_tg_id}</b><br>Məbləğ: <b>${dep.coin_amount} Coin</b></span>
                            <button class="btn-g" onclick="approveDep('${uid}', '${depKey}', ${dep.coin_amount})">Təsdiq Et</button>
                        </div>`;
                    }
                });
            }
        });
    });

    // 2. TƏSDİQ FUNKSİYASI
    window.approveDep = (uid, depKey, amt) => {
        if(confirm("Bu depoziti təsdiqləyirsiniz?")) {
            const userCoinsRef = rdb.ref(`users/${uid}/coins`);
            userCoinsRef.once('value', s => {
                const current = s.val() || 0;
                userCoinsRef.set(current + Number(amt));
                // Statusu 'completed' et və ya sadəcə sil
                rdb.ref(`users/${uid}/deposits/${depKey}/status`).set("completed");
                alert("Balans artırıldı!");
            });
        }
    };
</script>
</body>
</html>
