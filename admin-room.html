<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bearbee Arena | Admin Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #000; --panel: #111; --gold: #ffd700; --green: #22ff66; --red: #ff2438; --text: #fff; }
        body { background: var(--bg); color: var(--text); padding: 15px; font-family: sans-serif; }
        .card { background: var(--panel); border: 1px solid #222; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        h2 { color: var(--gold); font-size: 14px; margin-bottom: 10px; }
        .item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #222; font-size: 12px; }
        .btn { padding: 5px 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 10px; }
        .btn-g { background: var(--gold); color: #000; }
        .btn-r { background: var(--red); color: #fff; }
    </style>
</head>
<body>

<div id="adminWrapper">
    <div class="card">
        <h2>Oyunçular & Maliyyə</h2>
        <div id="userTableBody"></div>
    </div>
    <div class="card">
        <h2>Aktiv Yarışlar</h2>
        <div id="roomsList"></div>
    </div>
    <div class="card">
        <h2>Son 2 Saatın Fəaliyyəti</h2>
        <div id="logList"></div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
    const ADMIN_TELEGRAM_ID = 8591374417;
    const config = { apiKey: "AIzaSyCnbIgRIgQn7rO06epoPnHKYlzpE8wQJIQ", databaseURL: "https://racegane-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "racegane" };
    firebase.initializeApp(config);
    const rdb = firebase.database();

    // 1. İSTİFADƏÇİLƏR VƏ MALIYYƏ
    rdb.ref('users').on('value', (s) => {
        const users = s.val() || {};
        const container = document.getElementById("userTableBody");
        const fin = document.getElementById("logList"); // Buranı jurnalla birləşdirdik
        container.innerHTML = "";
        
        Object.keys(users).forEach(uid => {
            const u = users[uid];
            container.innerHTML += `<div class="item">
                <span>${u.name || "Ayı"} (${u.coins || 0} 🪙)</span>
                <button class="btn btn-g" onclick="editCoins('${uid}', ${u.coins})">Dəyiş</button>
            </div>`;
            
            if (u.deposit || u.pending_deposit) {
                const node = u.deposit ? "deposit" : "pending_deposit";
                container.innerHTML += `<div class="item" style="color:var(--green)">Depozit: ${u[node].amount || u[node]} 
                <button class="btn btn-g" onclick="approve('${uid}', '${node}', ${u[node].amount || u[node]})">Təsdiq</button></div>`;
            }
        });
    });

    // 2. SON 2 SAATIN LOGLARI
    const twoHours = Date.now() - (2 * 60 * 60 * 1000);
    rdb.ref('logs').orderByChild('timestamp').startAt(twoHours).on('value', (s) => {
        const list = document.getElementById("logList"); list.innerHTML = "";
        Object.values(s.val() || {}).forEach(l => list.innerHTML += `<div class="item">${l.time} - ${l.action}</div>`);
    });

    // FUNKSİYALAR
    window.editCoins = (uid, cur) => { const v = prompt("Yeni balans:", cur); if(v) rdb.ref(`users/${uid}/coins`).set(Number(v)); };
    
    window.approve = (uid, node, amt) => {
        rdb.ref(`users/${uid}/coins`).once('value', s => {
            rdb.ref(`users/${uid}`).update({ coins: (s.val()||0) + amt });
            rdb.ref(`users/${uid}/${node}`).remove();
            rdb.ref('logs').push({ action: `Təsdiqləndi: ${amt} Coin`, time: new Date().toLocaleTimeString(), timestamp: Date.now() });
        });
    };

    // 3. OTAQLAR
    rdb.ref('rooms').on('value', (s) => {
        const list = document.getElementById("roomsList"); list.innerHTML = "";
        Object.keys(s.val() || {}).forEach(k => list.innerHTML += `<div class="item">#${k} <button class="btn btn-r" onclick="rdb.ref('rooms/${k}').remove()">Sil</button></div>`);
    });
</script>
</body>
</html>
