<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel</title>
  <style>
    body { font-family: Arial, sans-serif; background:#111; color:#eee; }
    h2 { color:#0ff; }
    .section { margin:20px; padding:15px; border:1px solid #444; border-radius:8px; }
    button { margin:5px; padding:8px 12px; border:none; border-radius:4px; cursor:pointer; }
    .approve { background:#0a0; color:#fff; }
    .reject { background:#a00; color:#fff; }
    .paid { background:#06f; color:#fff; }
  </style>
</head>
<body>
  <h1>Admin Panel</h1>

  <div class="section">
    <h2>Pending Deposits</h2>
    <div id="deposits"></div>
  </div>

  <div class="section">
    <h2>Pending Withdrawals</h2>
    <div id="withdrawals"></div>
  </div>

  <div class="section">
    <h2>Pending TON Card Orders</h2>
    <div id="cards"></div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient("https://YOUR_PROJECT.supabase.co", "YOUR_PUBLIC_ANON_KEY");

    async function loadTransactions() {
      let { data, error } = await supabase
        .from("transactions")
        .select("*")
        .eq("status", "pending");

      if (error) {
        console.error(error);
        return;
      }

      const deposits = data.filter(t => t.type === "deposit");
      const withdrawals = data.filter(t => t.type === "withdraw");
      const cards = data.filter(t => t.type === "card");

      renderSection("deposits", deposits);
      renderSection("withdrawals", withdrawals);
      renderSection("cards", cards);
    }

    function renderSection(id, items) {
      const container = document.getElementById(id);
      container.innerHTML = "";
      items.forEach(t => {
        const div = document.createElement("div");
        div.innerHTML = `
          <p>User: ${t.user_id} | Amount: ${t.amount} ${t.coin}</p>
          <button class="approve" onclick="updateStatus('${t.id}','approve')">Approve</button>
          <button class="reject" onclick="updateStatus('${t.id}','reject')">Reject</button>
          <button class="paid" onclick="updateStatus('${t.id}','paid')">Paid</button>
        `;
        container.appendChild(div);
      });
    }

    window.updateStatus = async (id, status) => {
      let { error } = await supabase
        .from("transactions")
        .update({ status })
        .eq("id", id);

      if (error) {
        alert("Xəta: " + error.message);
      } else {
        alert("Status dəyişdirildi: " + status);
        loadTransactions();
      }
    };

    loadTransactions();
  </script>
</body>
</html>
