<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEARBEE ADMIN</title>
<style>
    body { font-family: Arial, sans-serif; background: #0b0c1a; color: #fff; margin: 0; padding: 0; }
    .container { padding: 20px; max-width: 500px; margin: auto; }
    .card { background: #1a1b2d; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
    h2 { color: #ffd700; }
    .status { color: #00ffff; margin-top: 10px; }
    button { background: #ffd700; color: #000; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; }
</style>
</head>
<body>
<div class="container">
    <h1>BEARBEE ADMIN</h1>

    <div class="card">
        <h2>Pending Deposits</h2>
        <div id="deposits">Deposits yüklənir...</div>
        <div id="depositStatus" class="status"></div>
    </div>

    <div class="card">
        <h2>Pending Withdrawals</h2>
        <div id="withdrawals">Withdrawals yüklənir...</div>
        <div id="withdrawStatus" class="status"></div>
    </div>

    <div class="card">
        <h2>Pending TON Card Orders</h2>
        <div id="tonOrders">TON Card Orders yüklənir...</div>
        <div id="tonStatus" class="status"></div>
    </div>

    <button onclick="reloadPanel()">Yenilə</button>
</div>

<script>
function fetchData(url, displayId, statusId) {
    try {
        // Simulyasiya: serverdən data alma
        let data = null; // əgər real API varsa buraya fetch() istifadə olunacaq

        // Null check
        if (!data || data.length === 0) {
            document.getElementById(displayId).innerText = "Yüklənə bilmir.";
            document.getElementById(statusId).innerText = "";
        } else {
            document.getElementById(displayId).innerText = JSON.stringify(data);
            document.getElementById(statusId).innerText = "Yükləndi";
        }
    } catch(e) {
        document.getElementById(displayId).innerText = "Xəta baş verdi";
        document.getElementById(statusId).innerText = e.message;
    }
}

function loadAdminPanel() {
    fetchData("/api/deposits", "deposits", "depositStatus");
    fetchData("/api/withdrawals", "withdrawals", "withdrawStatus");
    fetchData("/api/ton-orders", "tonOrders", "tonStatus");
}

function reloadPanel() {
    loadAdminPanel();
}

// Avtomatik yüklə
window.onload = loadAdminPanel;
</script>
</body>
</html>
