<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel - RaceGame</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #111; color: #eee; }
    h1 { color: #0ff; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #444; padding: 8px; text-align: center; }
    button { margin: 4px; padding: 6px 12px; cursor: pointer; border: none; }
    .approve { background: #0a0; color: #fff; }
    .reject { background: #a00; color: #fff; }
    .paid { background: #06c; color: #fff; }
    input { margin: 6px; padding: 6px; }
  </style>
</head>
<body>
  <h1>Admin Panel - Transactions</h1>

  <!-- Filtr -->
  <label>Status filter:</label>
  <select id="statusFilter" onchange="fetchTransactions()">
    <option value="pending">Pending</option>
    <option value="approve">Approve</option>
    <option value="reject">Reject</option>
    <option value="paid">Paid</option>
    <option value="all">All</option>
  </select>

  <label>User ID:</label>
  <input type="text" id="userSearch" placeholder="user123">
  <button onclick="fetchTransactions()">Search</button>

  <table id="transactions">
    <thead>
      <tr>
        <th>ID</th>
        <th>User</th>
        <th>Type</th>
        <th>Amount</th>
        <th>Status</th>
        <th>Tx Hash</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const supabase = window.supabase.createClient(
      "https://tddvicvdndrckoiynbay.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRkZHZpY3ZkbmRyY2tvaXluYmF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MjU2MDgsImV4cCI6MjA5NTMwMTYwOH0.jOsCfq1dgFI7zv--B6xF_u7YrsSWHFamxrLFNFMc2mg"
    );

    async function fetchTransactions() {
      let query = supabase.from("transactions").select("*");
      const status = document.getElementById("statusFilter").value;
      const userId = document.getElementById("userSearch").value;

      if (status !== "all") query = query.eq("status", status);
      if (userId) query = query.eq("user_id", userId);

      const { data, error } = await query.order("created_at", { ascending: false });

      if (error) {
        alert("Fetch error: " + error.message);
        return;
      }

      const tbody = document.querySelector("#transactions tbody");
      tbody.innerHTML = "";
      data.forEach(tx => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${tx.id}</td>
          <td>${tx.user_id}</td>
          <td>${tx.type}</td>
          <td>${tx.amount}</td>
          <td>${tx.status}</td>
          <td>${tx.tx_hash || ""}</td>
          <td>
            <button class="approve" onclick="updateStatus('${tx.id}','approve')">Approve</button>
            <button class="reject" onclick="updateStatus('${tx.id}','reject')">Reject</button>
            <button class="paid" onclick="markPaid('${tx.id}')">Paid</button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    async function updateStatus(id, newStatus) {
      const { error } = await supabase
        .from("transactions")
        .update({ status: newStatus })
        .eq("id", id);

      if (error) {
        alert("Update error: " + error.message);
      } else {
        alert("Status updated to " + newStatus);
        fetchTransactions();
      }
    }

    async function markPaid(id) {
      const txHash = prompt("Enter blockchain tx_hash:");
      const { error } = await supabase
        .from("transactions")
        .update({ status: "paid", tx_hash: txHash })
        .eq("id", id);

      if (error) {
        alert("Paid update error: " + error.message);
      } else {
        alert("Transaction marked as paid!");
        fetchTransactions();
      }
    }

    // İlk açılışda pending əməliyyatları göstər
    fetchTransactions();
  </script>
</body>
</html>
