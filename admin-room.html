<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bearbee Admin Wallet + Stats</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;padding:0;font-family:'Segoe UI',sans-serif;background:#111;color:#fff;}
.page{max-width:700px;margin:0 auto;padding:16px;}
.panel{background:#222;border-radius:18px;padding:18px;margin-bottom:18px;}
.panel-title{color:#ffd700;font-size:22px;margin-bottom:14px;text-align:center;}
.history-item{background:#1a1a1a;border:1px solid #263f5d;border-radius:14px;padding:14px;margin-bottom:10px;}
.history-item b{color:#ffd700;}
.btn{padding:8px 14px;border-radius:8px;color:#fff;text-decoration:none;margin-top:6px;cursor:pointer;border:none;font-size:14px;}
.btn-green{background:#28a745;margin-right:6px;}
.btn-red{background:#dc3545;}
.stats{background:#1a1a1a;border:1px solid #263f5d;border-radius:14px;padding:14px;margin-bottom:12px;}
.stats h4{color:#ffd700;margin-bottom:6px;}
.stats p{color:#98a8ba;margin:2px 0;font-size:13px;}
</style>
</head>
<body>
<main class="page">

<section class="panel">
<h2 class="panel-title">💎 Pending Deposits</h2>
<div id="depositHistory"></div>
</section>

<section class="panel">
<h2 class="panel-title">💰 Pending Withdrawals</h2>
<div id="withdrawHistory"></div>
</section>

<section class="panel">
<h2 class="panel-title">📊 İstifadəçi Statistikası</h2>
<div id="userStats"></div>
</section>

<script>
const SUPABASE_URL = "https://tddvicvdndrckoiynbay.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."; // tam key
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Rendering
function renderDeposits(list){
  const depositHistory = document.getElementById("depositHistory");
  depositHistory.innerHTML = "";
  if(!list.length){ depositHistory.innerHTML="<div class='history-item'>Pending deposit yoxdur.</div>"; return; }
  list.forEach(d=>{
    const div = document.createElement("div");
    div.className = "history-item";
    div.innerHTML = `<b>#${d.id}</b> — ${d.ton_amount} TON → ${d.coin_amount} coin<br>Status: ${d.status}<br>TX: ${d.tx_hash||"-"}<br>
      <button class="btn btn-green" onclick="approveDeposit(${d.id})">Approve</button>
      <button class="btn btn-red" onclick="rejectDeposit(${d.id})">Reject</button>`;
    depositHistory.appendChild(div);
  });
}

function renderWithdrawals(list){
  const withdrawHistory = document.getElementById("withdrawHistory");
  withdrawHistory.innerHTML = "";
  if(!list.length){ withdrawHistory.innerHTML="<div class='history-item'>Pending withdraw yoxdur.</div>"; return; }
  list.forEach(w=>{
    const div = document.createElement("div");
    div.className = "history-item";
    div.innerHTML = `<b>#${w.id}</b> — ${w.coin_amount} coin<br>Alacaq: ${w.ton_amount} TON<br>Status: ${w.status}<br>Wallet: ${w.wallet_address||"-"}<br>
      <button class="btn btn-green" onclick="markWithdrawPaid(${w.id})">Mark Paid</button>
      <button class="btn btn-red" onclick="rejectWithdraw(${w.id})">Reject</button>`;
    withdrawHistory.appendChild(div);
  });
}

function renderUserStats(list){
  const userStats = document.getElementById("userStats");
  userStats.innerHTML = "";
  if(!list.length){ userStats.innerHTML="<div class='stats'>İstifadəçi yoxdur.</div>"; return; }
  list.forEach(u=>{
    const div = document.createElement("div");
    div.className = "stats";
    div.innerHTML = `<h4>Telegram ID: ${u.telegram_id}</h4>
      <p>TON Balans: ${u.ton_balance}</p>
      <p>Coin Balans: ${u.coin_balance}</p>
      <p>Total Deposits: ${u.total_deposit}</p>
      <p>Total Withdrawals: ${u.total_withdraw}</p>`;
    userStats.appendChild(div);
  });
}

// Load data
async function loadPending(){
  const { data: deposits } = await supabase.from("deposits").select("*").eq("status","Pending");
  const { data: withdrawals } = await supabase.from("withdrawals").select("*").eq("status","Pending");
  const { data: users } = await supabase.from("wallets").select("telegram_id, ton_balance, coin_balance, deposits:deposits(amount_ton), withdrawals:withdrawals(amount_ton)");
  renderDeposits(deposits||[]);
  renderWithdrawals(withdrawals||[]);
  const statsList = users.map(u=>({
    telegram_id:u.telegram_id,
    ton_balance:u.ton_balance,
    coin_balance:u.coin_balance,
    total_deposit:(u.deposits||[]).reduce((a,b)=>a+b.amount_ton,0),
    total_withdraw:(u.withdrawals||[]).reduce((a,b)=>a+b.amount_ton,0)
  }));
  renderUserStats(statsList);
}

// Admin actions
async function approveDeposit(id){ await supabase.rpc('admin_approve_deposit',{request_id:id,p_admin_note:'Approve'}); loadPending(); }
async function rejectDeposit(id){ await supabase.rpc('admin_reject_deposit',{request_id:id,p_admin_note:'Reject'}); loadPending(); }
async function markWithdrawPaid(id){ await supabase.rpc('admin_mark_withdrawal_paid',{request_id:id,p_admin_note:'Paid'}); loadPending(); }
async function rejectWithdraw(id){ await supabase.rpc('admin_reject_withdrawal',{request_id:id,p_admin_note:'Reject'}); loadPending(); }

loadPending();
</script>
</main>
</body>
</html>
