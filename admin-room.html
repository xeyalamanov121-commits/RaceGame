<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bearbee Admin Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{margin:0;padding:0;font-family:'Segoe UI',sans-serif;background:#0a0f1a;color:#fff;}
.container{max-width:1200px;margin:0 auto;padding:16px;}
.panel{background:#121a2a;border-radius:20px;padding:20px;margin-bottom:16px;}
.panel-title{color:#ffd700;font-size:22px;margin-bottom:12px;text-align:center;}
.btn{padding:8px 14px;border-radius:8px;color:#fff;cursor:pointer;border:none;margin-right:6px;}
.btn-green{background-color:#28a745;}
.btn-red{background-color:#dc3545;}
.btn-gold{background-color:#ffc107;color:#111;}
.history-item{background:#1c2536;padding:12px;border-radius:12px;margin-bottom:10px;}
table{width:100%;border-collapse:collapse;margin-top:12px;}
th,td{padding:10px;border:1px solid #263f5d;text-align:center;}
th{background-color:#1c2536;color:#ffd700;}
td{background-color:#131b2b;color:#00d4ff;}
</style>
</head>
<body>
<div class="container">
<h1 style="text-align:center;color:#ffd700;">💎 Bearbee Wallet Admin Panel</h1>

<section class="panel">
<h2 class="panel-title">Pending Deposits</h2>
<div id="depositHistory">Yüklənir...</div>
</section>

<section class="panel">
<h2 class="panel-title">Pending Withdrawals</h2>
<div id="withdrawHistory">Yüklənir...</div>
</section>

<section class="panel">
<h2 class="panel-title">User Statistics</h2>
<div id="userStats">Yüklənir...</div>
</section>
</div>

<script>
const SUPABASE_URL = "https://tddvicvdndrckoiynbay.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...";
const ADMIN_TELEGRAM_ID = 8591374417;

const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
const telegramUser = tg?.initDataUnsafe?.user || null;

function isAdmin(){ return telegramUser && Number(telegramUser.id) === ADMIN_TELEGRAM_ID; }

function renderDeposits(list){
  const container = document.getElementById("depositHistory");
  container.innerHTML = "";
  if(!list.length){ container.innerHTML="<div>Pending deposit yoxdur.</div>"; return; }
  list.forEach(d=>{
    const div=document.createElement("div");
    div.className="history-item";
    div.innerHTML=`<b>#${d.id}</b> — TON: ${d.ton_amount}, Coin: ${d.coin_amount}<br>TX: ${d.tx_hash||"-"}<br>Status: ${d.status}<br>
      <button class="btn btn-green" onclick="approveDeposit(${d.id})">Approve</button>
      <button class="btn btn-red" onclick="rejectDeposit(${d.id})">Reject</button>`;
    container.appendChild(div);
  });
}

function renderWithdrawals(list){
  const container=document.getElementById("withdrawHistory");
  container.innerHTML="";
  if(!list.length){ container.innerHTML="<div>Pending withdraw yoxdur.</div>"; return; }
  list.forEach(w=>{
    const div=document.createElement("div");
    div.className="history-item";
    div.innerHTML=`<b>#${w.id}</b> — Coin: ${w.coin_amount}, TON: ${w.ton_amount}<br>Wallet: ${w.wallet_address}<br>Status: ${w.status}<br>
      <button class="btn btn-green" onclick="markWithdrawPaid(${w.id})">Mark Paid</button>
      <button class="btn btn-red" onclick="rejectWithdraw(${w.id})">Reject</button>`;
    container.appendChild(div);
  });
}

function renderUserStats(list){
  const container=document.getElementById("userStats");
  container.innerHTML="";
  if(!list.length){ container.innerHTML="İstifadəçi yoxdur."; return; }
  let table=`<table>
    <tr><th>Telegram ID</th><th>TON Balance</th><th>Coin Balance</th><th>Total Deposit</th><th>Total Withdraw</th></tr>`;
  list.forEach(u=>{
    table+=`<tr><td>${u.telegram_id}</td><td>${u.ton_balance}</td><td>${u.coin_balance}</td><td>${u.total_deposit}</td><td>${u.total_withdraw}</td></tr>`;
  });
  table+="</table>";
  container.innerHTML=table;
}

async function loadPending(){
  if(!isAdmin()){ alert("Admin deyilsiniz!"); return; }

  const { data: deposits } = await supabase.from('deposits').select('*').eq('status','Pending');
  const { data: withdrawals } = await supabase.from('withdrawals').select('*').eq('status','Pending');
  const { data: users } = await supabase.from('wallets').select('*');

  renderDeposits(deposits||[]);
  renderWithdrawals(withdrawals||[]);

  const statsList = users.map(u=>({
    telegram_id:u.telegram_id,
    ton_balance:u.ton_balance,
    coin_balance:u.coin_balance,
    total_deposit:u.total_deposit||0,
    total_withdraw:u.total_withdraw||0
  }));
  renderUserStats(statsList);
}

async function approveDeposit(id){ await supabase.rpc('admin_approve_deposit',{request_id:id}); loadPending(); }
async function rejectDeposit(id){ await supabase.rpc('admin_reject_deposit',{request_id:id}); loadPending(); }
async function markWithdrawPaid(id){ await supabase.rpc('admin_mark_withdrawal_paid',{request_id:id}); loadPending(); }
async function rejectWithdraw(id){ await supabase.rpc('admin_reject_withdrawal',{request_id:id}); loadPending(); }

loadPending();
</script>
</body>
</html>
