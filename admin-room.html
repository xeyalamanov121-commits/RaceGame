<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel | Bearbee Arena</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; padding: 20px; }
        .card { background: #111; border: 1px solid #333; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .item { border-bottom: 1px solid #222; padding: 10px 0; font-size: 12px; }
        .btn-g { background: #ffd700; color: #000; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="color:#ffd700">Maliyyə Sorğuları (Debug Mod)</h2>
    <div id="financeList"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
    const config = { databaseURL: "https://racegane-default-rtdb.asia-southeast1.firebasedatabase.app" };
    firebase.initializeApp(config);
    const rdb = firebase.database();

    rdb.ref('p2p_market').on('value', (s) => {
        const market = s.val() || {};
        const finList = document.getElementById("financeList");
        finList.innerHTML = "";
        
        Object.keys(market).forEach(key => {
            const item = market[key];
            
            // SORĞUNUN İÇİNDƏKİ HƏR ŞEYİ EKRANA ÇIXARIR
            // Əgər istifadəçinin ID-si varsa, burada "seller_id", "user_id" və ya başqa adla görünəcək
            const rawData = JSON.stringify(item, null, 2); 
            
            finList.innerHTML += `<div class="item">
                <pre style="font-size: 10px; color: #888;">${rawData}</pre>
                <button class="btn-g" onclick="processPayment('${key}', ${item.price_coin || 0})">Təsdiq Et</button>
            </div>`;
        });
    });

    window.processPayment = (key, amt) => {
        const userId = prompt("Bu sorğu hansı ID-yə aiddir? (Yuxarıdakı məlumatdan bax və bura yaz):");
        if(userId) {
            rdb.ref(`users/${userId}/coins`).once('value', s => {
                const current = s.val() || 0;
                rdb.ref(`users/${userId}/coins`).set(current + Number(amt));
                rdb.ref('p2p_market/' + key).remove();
                alert("Balans artırıldı!");
            });
        }
    };
</script>
</body>
</html>
