<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<title>Bearbee Arena | Master Admin Panel</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root { --bg: #050505; --card: #121212; --gold: #ffd700; --red: #ff3333; --green: #00ff66; }
body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; padding: 20px; margin:0; }
h1 { margin-bottom: 30px; text-align:center; color: var(--gold); }
.container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
.card { background: var(--card); border: 1px solid #333; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); max-height: 500px; overflow-y: auto; }
h2 { border-bottom: 2px solid #333; padding-bottom: 10px; font-size: 18px; margin-bottom:10px; }
.item { background: #1a1a1a; padding: 12px; margin: 10px 0; border-radius: 8px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--gold); gap: 8px; }
.item-info { flex: 1; line-height: 1.7; }
button { cursor: pointer; padding: 8px 14px; border: none; border-radius: 6px; font-weight: bold; transition: 0.3s; white-space: nowrap; }
.btn-yes { background: var(--green); color: #000; }
.btn-no { background: var(--red); color: #fff; }
.empty { color: #555; font-size: 13px; padding: 10px; text-align:center; }
@media(max-width:768px){ .container { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<h1>👑 BEARBEE MASTER ADMIN</h1>

<div class="container">
  <div class="card">
    <h2 style="color:var(--gold)">📥 Depozit Sorğuları</h2>
    <div id="depList"><span class="empty">Yüklənir...</span></div>
  </div>
  <div class="card">
    <h2 style="color:var(--red)">💸 Çıxarış Sorğuları</h2>
    <div id="withList"><span class="empty">Yüklənir...</span></div>
  </div>
  <div class="card">
    <h2 style="color:var(--green)">🛒 P2P Kart Bazarı</h2>
    <div id="marketList"><span class="empty">Yüklənir...</span></div>
  </div>
</div>

<script>
const rdb = firebase.initializeApp({
    databaseURL: "https://racegane-default-rtdb.asia-southeast1.firebasedatabase.app"
}).database();

// ══════════════════════════════════════
// 1) DEPOZİTLƏR — users/{uid}/deposits
// ══════════════════════════════════════
rdb.ref("users").on("value", snapshot => {
    const users = snapshot.val() || {};
    const depList = document.getElementById("depList");
    depList.innerHTML = "";
    let count = 0;

    Object.keys(users).forEach(uid => {
        const user = users[uid];
        if (!user.deposits) return;

        Object.keys(user.deposits).forEach(depKey => {
            const dep = user.deposits[depKey];
            if ((dep.status || "").toLowerCase() !== "pending") return;
            count++;
            depList.innerHTML += `
            <div class="item">
                <div class="item-info">
                    👤 ID: <b>${dep.user_tg_id || uid}</b><br>
                    💰 <b>${dep.coin_amount || 0} Coin</b>
                </div>
                <button class="btn-yes"
                    onclick="approveDep('${uid}','${depKey}',${dep.coin_amount || 0})">
                    ✅ Təsdiq
                </button>
            </div>`;
        });
    });

    if (count === 0) depList.innerHTML = '<div class="empty">Gözləyən depozit yoxdur</div>';
});

// ══════════════════════════════════════
// 2) ÇIXARIŞLAR — withdrawals (kök)
// ══════════════════════════════════════
rdb.ref("withdrawals").on("value", snapshot => {
    const data = snapshot.val() || {};
    const withList = document.getElementById("withList");
    withList.innerHTML = "";
    let count = 0;

    Object.keys(data).forEach(wKey => {
        const w = data[wKey];
        if (!w || (w.status || "").toLowerCase() !== "pending") return;
        count++;

        withList.innerHTML += `
        <div class="item" style="border-left-color:var(--red); flex-wrap:wrap;">
            <div class="item-info">
                👤 ID: <b>${w.user_tg_id || "N/A"}</b><br>
                💰 Coin: <b>${w.coin_amount || 0}</b>
                &nbsp;·&nbsp; Komissiya: ${w.fee_coin_amount || 0}<br>
                💎 TON: <b>${w.ton_amount || "?"}</b><br>
                🔑 ID: <small>${w.id || wKey}</small><br>
                📬 <small style="word-break:break-all;">${w.wallet_address || "Ünvan yoxdur"}</small>
            </div>
            <button class="btn-yes" onclick="approveWith('${wKey}')">✅ Ödənildi</button>
        </div>`;
    });

    if (count === 0) withList.innerHTML = '<div class="empty">Gözləyən çıxarış yoxdur</div>';
});

// ══════════════════════════════════════
// 3) P2P MARKET — p2p_market (kök)
// ══════════════════════════════════════
rdb.ref("p2p_market").on("value", snapshot => {
    const data = snapshot.val() || {};
    const marketList = document.getElementById("marketList");
    marketList.innerHTML = "";
    const keys = Object.keys(data);

    if (keys.length === 0) {
        marketList.innerHTML = '<div class="empty">Bazar boşdur</div>';
        return;
    }

    keys.forEach(mKey => {
        const m = data[mKey];
        marketList.innerHTML += `
        <div class="item" style="border-left-color:var(--green);">
            <div class="item-info">
                🃏 Kart: <b>${m.template_id}</b><br>
                💰 Qiymət: <b>${m.price_coin}</b>
            </div>
            <button class="btn-no" onclick="removeMarket('${mKey}')">🗑 Sil</button>
        </div>`;
    });
});

// ══════════════════════════════════════
// FUNKSİYALAR
// ══════════════════════════════════════
window.approveDep = (uid, depKey, amount) => {
    if (!confirm("Bu depoziti təsdiqləyirsiniz?")) return;
    rdb.ref(`users/${uid}/coins`).transaction(c => (c || 0) + Number(amount));
    rdb.ref(`users/${uid}/deposits/${depKey}/status`).set("completed");
};

window.approveWith = (wKey) => {
    if (!confirm("Bu çıxarışı tamamlandı kimi qeyd edirsiniz?")) return;
    rdb.ref(`withdrawals/${wKey}/status`).set("completed");
};

window.removeMarket = (mKey) => {
    if (!confirm("Bu elanı silmək istəyirsiniz?")) return;
    rdb.ref(`p2p_market/${mKey}`).remove();
};
</script>

</body>
</html>
