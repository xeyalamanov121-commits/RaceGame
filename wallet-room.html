<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bearbee Wallet Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{margin:0;padding:0;font-family:'Segoe UI',sans-serif;background:#111;color:#fff;}
.page{max-width:1200px;margin:0 auto;padding:16px;}
.panel{background:#222;border-radius:24px;padding:18px;margin-bottom:16px;}
.panel-title{color:#ffd700;font-size:24px;margin-bottom:10px;text-align:center;}
.history{display:grid;gap:10px;margin-top:12px;}
.history-item{background:#030a13;border:1px solid #263f5d;border-radius:14px;padding:12px;color:#a8b4c4;}
.history-item b{color:#ffd700;}
.btn{padding:8px 12px;border-radius:8px;color:#fff;text-decoration:none;margin-top:6px;cursor:pointer;}
.btn-green{background:#28a745;}
.btn-red{background:#dc3545;}
.btn-gold{background:#ffc107;color:#111;}
textarea{width:100%;padding:8px;border-radius:6px;background:#222;color:#fff;border:none;margin-top:6px;}
.log{background:#111;padding:8px;border-radius:6px;color:#0f0;margin-top:6px;}
</style>
</head>
<body>
<main class="page">
<section class="panel">
<h2 class="panel-title">💎 Pending Deposits</h2>
<div id="depositHistory" class="history"></div>
<div class="log" id="depositLog"></div>
</section>

<section class="panel">
<h2 class="panel-title">💰 Pending Withdrawals</h2>
<div id="withdrawHistory" class="history"></div>
<div class="log" id="withdrawLog"></div>
</section>

<section class="panel">
<h2 class="panel-title">📊 İstifadəçi Balansı</h2>
<div id="userBalances"></div>
</section>
</main>

<script>
const SUPABASE_URL = "https://tddvicvdndrckoiynbay.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...";
const ADMIN_TELEGRAM_ID = 8591374417;

const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();
const telegramUser = tg?.initDataUnsafe?.user || null;

function isAdmin() { return telegramUser && Number(telegramUser.id) === ADMIN_TELEGRAM_ID; }

async function loadPending() {
  if(!isAdmin()){ alert("Admin deyilsiniz!"); return; }

  const { data: deposits } = await supabase.from('deposits').select('*').eq('status','Pending');
  const { data: withdrawals } = await supabase.from('withdrawals').select('*').eq('status','Pending');
  const { data: wallets } = await supabase.from('wallets').select('*');

  renderDeposits(deposits||[]);
  renderWithdrawals(withdrawals||[]);
  renderWallets(wallets||[]);
}

function renderDeposits(list){
  const depositHistory = document.getElementById("depositHistory");
  depositHistory.innerHTML="";
  if(!list.length){ depositHistory.innerHTML='<div class="history-item">Pending deposit yoxdur.</div>'; return; }

  list.forEach(d=>{
    const div = document.createElement("div");
    div.className="history-item";
    div.innerHTML=`<b>#${d.id}</b> — ${d.ton_amount} TON → ${d.coin_amount} coin<br>TX: ${d.tx_hash||"-"}<br>Status: ${d.status}<br>
      <textarea id="dep_note_${d.id}" placeholder="Admin qeyd"></textarea>
      <button class="btn btn-green" onclick="approveDeposit(${d.id})">Approve</button>
      <button class="btn btn-red" onclick="rejectDeposit(${d.id})">Reject</button>`;
    depositHistory.appendChild(div);
  });
}

function renderWithdrawals(list){
  const withdrawHistory = document.getElementById("withdrawHistory");
  withdrawHistory.innerHTML="";
  if(!list.length){ withdrawHistory.innerHTML='<div class="history-item">Pending withdraw yoxdur.</div>'; return; }

  list.forEach(w=>{
    const div = document.createElement("div");
    div.className="history-item";
    div.innerHTML=`<b>#${w.id}</b> — ${w.coin_amount} coin<br>Alacaq: ${w.ton_amount} TON<br>Status: ${w.status}<br>Wallet: ${w.wallet_address||"-"}<br>
      <textarea id="wd_note_${w.id}" placeholder="Admin qeyd"></textarea>
      <button class="btn btn-green" onclick="markWithdrawPaid(${w.id})">Mark Paid</button>
      <button class="btn btn-red" onclick="rejectWithdraw(${w.id})">Reject</button>`;
    withdrawHistory.appendChild(div);
  });
}

function renderWallets(list){
  const container = document.getElementById("userBalances");
  container.innerHTML="";
  if(!list.length){ container.innerHTML='<div class="history-item">İstifadəçi yoxdur.</div>'; return; }

  list.forEach(w=>{
    const div = document.createElement("div");
    div.className="history-item";
    div.innerHTML=`<b>Telegram ID: ${w.telegram_id}</b><br>TON Balance: ${w.ton_balance}<br>Coin Balance: ${w.coin_balance}`;
    container.appendChild(div);
  });
}

// Admin actions
async function approveDeposit(id){
  const note = document.getElementById("dep_note_"+id)?.value || "TON gəldi, coin əlavə edildi";
  await supabase.rpc('admin_approve_deposit',{request_id:id,p_admin_note:note});
  loadPending();
}

async function rejectDeposit(id){
  const note = document.getElementById("dep_note_"+id)?.value || "Ödəniş tapılmadı";
  await supabase.rpc('admin_reject_deposit',{request_id:id,p_admin_note:note});
  loadPending();
}

async function markWithdrawPaid(id){
  const note = document.getElementById("wd_note_"+id)?.value || "TON göndərildi";
  await supabase.rpc('admin_mark_withdrawal_paid',{request_id:id,p_admin_note:note});
  loadPending();
}

async function rejectWithdraw(id){
  const note = document.getElementById("wd_note_"+id)?.value || "Withdraw rədd edildi";
  await supabase.rpc('admin_reject_withdrawal',{request_id:id,p_admin_note:note});
  loadPending();
}

loadPending();
</script>
</body>
</html>
