<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bearbee Wallet Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;padding:0;font-family:'Segoe UI',sans-serif;background:#01040a;color:#fff;}
.page{max-width:1100px;margin:0 auto;padding:16px;}
.panel{background:#111;border-radius:20px;padding:18px;margin-bottom:16px;border:1px solid #333;}
.panel h2{color:#ffd700;margin-bottom:10px;text-align:center;}
.request-list{display:grid;gap:12px;}
.request-card{background:#222;border:1px solid #444;border-radius:14px;padding:12px;}
.request-card b{color:#ffd700;}
.request-card .status{color:#0f0;font-weight:800;}
.btn{cursor:pointer;padding:8px 12px;border:none;border-radius:8px;margin-top:6px;color:#fff;}
.btn-green{background:#28a745;}
.btn-red{background:#dc3545;}
.log{background:#000;color:#0ff;padding:8px;border-radius:8px;margin-top:6px;text-align:center;}
.empty{text-align:center;color:#888;padding:12px;}
</style>
</head>
<body>
<div class="page">
<h1 style="text-align:center;color:#ffd700;">🛡 Bearbee Admin Wallet</h1>

<section class="panel">
<h2>Pending Deposits</h2>
<div id="depositList" class="request-list"><div class="empty">Yüklənir...</div></div>
<div class="log" id="depositLog"></div>
</section>

<section class="panel">
<h2>Pending Withdrawals</h2>
<div id="withdrawList" class="request-list"><div class="empty">Yüklənir...</div></div>
<div class="log" id="withdrawLog"></div>
</section>
</div>

<script>
const SUPABASE_URL = "https://tddvicvdndrckoiynbay.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRkZHZpY3ZkbmRyY2tvaXluYmF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MjU2MDgsImV4cCI6MjA5NTMwMTYwOH0.jOsCfq1dgFI7zv--B6xF_u7YrsSWHFamxrLFNFMc2mg";

const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Render Deposits
async function loadDeposits(){
    const { data, error } = await supabase.from('deposits').select('*').eq('status','pending');
    const depositList = document.getElementById('depositList');
    if(error){ depositList.innerHTML = `<div class="empty">Xəta: ${error.message}</div>`; return; }
    depositList.innerHTML = "";
    if(!data.length){ depositList.innerHTML='<div class="empty">Pending deposit yoxdur</div>'; return; }
    data.forEach(d=>{
        const div = document.createElement('div');
        div.className = 'request-card';
        div.innerHTML = `<b>Deposit #${d.id}</b> — ${d.amount} TON<br>Status: <span class="status">${d.status}</span><br>
        <button class="btn btn-green" onclick="approveDeposit('${d.id}')">Approve</button>
        <button class="btn btn-red" onclick="rejectDeposit('${d.id}')">Reject</button>`;
        depositList.appendChild(div);
    });
}

// Render Withdrawals
async function loadWithdrawals(){
    const { data, error } = await supabase.from('withdrawals').select('*').eq('status','pending');
    const withdrawList = document.getElementById('withdrawList');
    if(error){ withdrawList.innerHTML = `<div class="empty">Xəta: ${error.message}</div>`; return; }
    withdrawList.innerHTML = "";
    if(!data.length){ withdrawList.innerHTML='<div class="empty">Pending withdraw yoxdur</div>'; return; }
    data.forEach(w=>{
        const div = document.createElement('div');
        div.className = 'request-card';
        div.innerHTML = `<b>Withdraw #${w.id}</b> — ${w.amount} TON<br>Address: ${w.address}<br>Status: <span class="status">${w.status}</span><br>
        <button class="btn btn-green" onclick="markPaid('${w.id}')">Mark Paid</button>
        <button class="btn btn-red" onclick="rejectWithdraw('${w.id}')">Reject</button>`;
        withdrawList.appendChild(div);
    });
}

// Deposit Actions
async function approveDeposit(id){
    const { error } = await supabase.from('deposits').update({status:'approved'}).eq('id',id);
    if(error){ alert(error.message); return; }
    loadDeposits();
}

async function rejectDeposit(id){
    const reason = prompt("Reject səbəbini yazın:");
    const { error } = await supabase.from('deposits').update({status:'rejected', comment:reason}).eq('id',id);
    if(error){ alert(error.message); return; }
    loadDeposits();
}

// Withdraw Actions
async function markPaid(id){
    const { error } = await supabase.from('withdrawals').update({status:'paid'}).eq('id',id);
    if(error){ alert(error.message); return; }
    loadWithdrawals();
}

async function rejectWithdraw(id){
    const reason = prompt("Reject səbəbini yazın:");
    const { error } = await supabase.from('withdrawals').update({status:'rejected', comment:reason}).eq('id',id);
    if(error){ alert(error.message); return; }
    loadWithdrawals();
}

// Load both on start
loadDeposits();
loadWithdrawals();
</script>
</body>
</html>
