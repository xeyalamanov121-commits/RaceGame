<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bearbee User Wallet</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;padding:0;font-family:'Segoe UI',sans-serif;background:#111;color:#fff;}
.page{max-width:800px;margin:0 auto;padding:16px;}
.panel{background:#222;border-radius:24px;padding:18px;margin-bottom:16px;}
.panel-title{color:#ffd700;font-size:24px;margin-bottom:10px;text-align:center;}
.wallet-balance{background:#030a13;border:1px solid #263f5d;border-radius:16px;padding:14px;text-align:center;margin-bottom:12px;}
.wallet-balance h3{color:#98a8ba;margin-bottom:8px;}
.wallet-balance strong{color:#ffd700;font-size:22px;}
</style>
</head>
<body>
<main class="page">
<section class="panel">
<h2 class="panel-title">💎 Sənin Cüzdanın</h2>
<div id="walletBalances">
  <div class="wallet-balance">
    <h3>Coin Balansı</h3>
    <strong id="coinBalance">0</strong>
  </div>
  <div class="wallet-balance">
    <h3>TON Balansı</h3>
    <strong id="tonBalance">0</strong>
  </div>
</div>
</section>

<script>
const SUPABASE_URL = "https://tddvicvdndrckoiynbay.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...";
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Replace this with the actual Telegram user ID (from Mini App)
const TELEGRAM_ID = 123456789;

async function loadWallet() {
  const { data, error } = await supabase
    .from('wallets')
    .select('coin_balance, ton_balance')
    .eq('telegram_id', TELEGRAM_ID)
    .single();

  if(error) {
    console.error(error);
    return;
  }

  document.getElementById('coinBalance').innerText = data.coin_balance;
  document.getElementById('tonBalance').innerText = data.ton_balance;
}

loadWallet();
</script>
</main>
</body>
</html>
