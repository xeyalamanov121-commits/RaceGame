<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bearbee Arena | Multiplayer Turn Race</title>
<style>
:root{
--bg:#0b0f1a; --panel:#121927; --accent:#8b3cff; --gold:#ffd700; --green:#22ff66; --red:#ff2438; --muted:#9aa7b8;
}
body{margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:#fff;display:flex;flex-direction:column;min-height:100vh;}
.panel{background:var(--panel);margin:12px;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;}
.panel-title{color:var(--gold);font-weight:900;text-align:center;margin-bottom:8px;}
.track{position:relative;height:120px;background:rgba(255,255,255,0.05);border-radius:12px;overflow:hidden;margin-top:10px;}
.car{width:40px;height:40px;border-radius:8px;position:absolute;}
.finish{position:absolute;right:0;top:0;width:5px;height:100%;background:red;}
.copy-btn{background:linear-gradient(180deg,#8b3cff,#5a00ff);border:none;color:#fff;padding:10px;border-radius:10px;width:100%;cursor:pointer;margin-top:4px;}
.status-box{padding:8px;border-radius:10px;background:rgba(139,60,255,0.1);text-align:center;font-weight:900;}
input[type=text]{width:100%;padding:8px;border-radius:8px;border:none;margin-top:4px;background:rgba(255,255,255,0.05);color:#fff;}
</style>
</head>
<body>

<div class="panel">
<div class="panel-title">🏎️ Multiplayer Turn-Based Race</div>
<input type="text" id="roomInput" placeholder="Oda Kodu">
<button class="copy-btn" id="createBtn">Yeni Oda Yarat</button>
<button class="copy-btn" id="joinBtn">Qatıl</button>
<div class="status-box" id="raceStatus">Odaya qoşulmayıb</div>
<button class="copy-btn" id="readyBtn" disabled>Hazır Ol</button>
<button class="copy-btn" id="startBtn" disabled>Yarışı Başlat</button>
<button class="copy-btn" id="clickBtn" disabled>⚡ QAC (KLİK)</button>

<div class="track" id="track">
<div class="car" id="playerCar" style="background:#22ff66;top:10px;left:0;"></div>
<div class="car" id="opponentCar" style="background:#ff2438;top:60px;left:0;"></div>
<div class="finish"></div>
</div>
</div>

<div class="panel">
<div class="panel-title">💎 Depozit Paneli</div>
<div class="status-box" id="statusBox">💎 Depozit göndərdikdən sonra təsdiqlə</div>
<div class="copy-btn" id="sentBtn">✅ Göndərdim, Təsdiqlə</div>
<div class="copy-btn" id="cancelBtn" style="background:red;display:none;">❌ Ləğv et</div>
</div>

<script type="module">
// Firebase Setup
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, update, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// Firebase config
const firebaseConfig = { /* buraya firebase config */ };
const app = initializeApp(firebaseConfig);
const rdb = getDatabase(app);

// Demo user
const myId = String(Math.floor(Math.random()*10000));
let roomCode = null;
let isMyTurn = false;
let gameStarted = false;
let playerPos = 0, opponentPos = 0;
const trackWidth = 300;

// Elements
const playerCar = document.getElementById("playerCar");
const opponentCar = document.getElementById("opponentCar");
const clickBtn = document.getElementById("clickBtn");
const startBtn = document.getElementById("startBtn");
const raceStatus = document.getElementById("raceStatus");

// Room yaratmaq
document.getElementById("createBtn").onclick = async ()=>{
  roomCode = document.getElementById("roomInput").value || ("ROOM"+Math.floor(Math.random()*1000));
  await set(ref(rdb, `rooms/${roomCode}`), {turn:myId, started:false, players:{[myId]:0}});
  raceStatus.innerText="Oda yaradıldı. Sizin növbəniz";
  startBtn.disabled=false;
};

// Qoşulmaq
document.getElementById("joinBtn").onclick = async ()=>{
  roomCode = document.getElementById("roomInput").value;
  if(!roomCode) return;
  await update(ref(rdb, `rooms/${roomCode}/players`), {[myId]:0});
  raceStatus.innerText="Odaya qoşuldunuz. Hazır olun";
  document.getElementById("readyBtn").disabled=false;
};

// Yarışı başlat
startBtn.onclick = async ()=>{
  await update(ref(rdb, `rooms/${roomCode}`), {started:true});
  gameStarted = true;
  raceStatus.innerText="Yarış başladı";
  clickBtn.disabled = false;
};

// Klik düyməsi
clickBtn.onclick = async ()=>{
  if(!isMyTurn || !gameStarted) return;
  playerPos += 10;
  playerCar.style.left = playerPos + "px";
  await update(ref(rdb, `rooms/${roomCode}/players/${myId}`), playerPos);
  await update(ref(rdb, `rooms/${roomCode}`), {turn: getOpponentId()});
  checkFinish();
};

// Firebase listener
onValue(ref(rdb, `rooms/${roomCode}`), snap=>{
  if(!snap.exists()) return;
  const data = snap.val();
  isMyTurn = data.turn===myId;
  clickBtn.disabled = !isMyTurn;
  const opponentEntry = Object.entries(data.players).filter(p=>p[0]!==myId)[0];
  opponentPos = opponentEntry?.[1]||0;
  opponentCar.style.left = opponentPos + "px";
});

// Helpers
function getOpponentId(){
  if(!roomCode) return null;
  const playersRef = ref(rdb, `rooms/${roomCode}/players`);
  return Object.keys(playersRef.toString()).find(id=>id!==myId);
}

function checkFinish(){
  if(playerPos>=trackWidth){alert("Qalib: Siz"); clickBtn.disabled=true;}
  if(opponentPos>=trackWidth){alert("Qalib: Rəqib"); clickBtn.disabled=true;}
}
</script>
</body>
</html>
