<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bearbee Arena | Click Room</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>

<style>
:root{
  --bg:#02060d;
  --panel:#08111c;
  --text:#fff;
  --gold:#ffd700;
  --muted:#98a8ba;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{min-height:100vh;background:#01040a;color:var(--text);font-family:'Segoe UI',Arial,sans-serif;padding-bottom:92px;}
.page{width:min(1050px,100%);margin:0 auto;padding:16px;min-height:calc(100vh-92px);}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.back{color:var(--gold);text-decoration:none;font-weight:1000;background:rgba(8,18,32,0.82);border-radius:14px;padding:12px 14px;}
.logo{line-height:0.9;text-align:center;user-select:none;filter:drop-shadow(0 0 12px rgba(255,215,0,0.25));}
.logo .bearbee{font-size:24px;font-weight:1000;font-style:italic;color:#f4f7ff;text-shadow:0 3px 0 #29354a;}
.logo .arena{font-size:34px;font-weight:1000;font-style:italic;color:var(--gold);text-shadow:0 4px 0 #6a3e00;}
.status{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.status-box{background:rgba(8,18,32,0.88);border-radius:18px;padding:14px;text-align:center;}
.status-box h3{color:var(--muted);font-size:13px;margin-bottom:6px;text-transform:uppercase;}
.status-box span{color:var(--gold);font-size:24px;font-weight:1000;}
.layout{display:grid;grid-template-columns:1fr;gap:16px;}
.panel{background:linear-gradient(180deg,rgba(12,22,36,0.96),rgba(4,9,16,0.96));border-radius:22px;padding:16px;position:relative;}
.panel-title{color:var(--gold);text-align:center;font-size:22px;font-weight:1000;margin-bottom:10px;}
.panel-sub{color:var(--muted);text-align:center;font-size:14px;line-height:1.5;margin-bottom:14px;}
.bear-ring{width:270px;height:270px;margin:16px auto;border-radius:50%;padding:6px;cursor:pointer;display:block;background:conic-gradient(from 120deg,#1597ff,#ffd700,#9b3dff,#1597ff);box-shadow:0 0 40px rgba(21,151,255,0.3),0 0 35px rgba(255,215,0,0.18);}
.bear-ring:active{transform:scale(0.95);}
.bear-button{width:100%;height:100%;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 40% 25%, rgba(255,215,0,0.22), transparent 34%), linear-gradient(180deg,#07101b,#02060d);display:grid;place-items:center;position:relative;}
.bear-button img{width:100%;height:100%;object-fit:cover;display:block;}
.bear-fallback{font-size:96px;filter:drop-shadow(0 0 16px rgba(255,215,0,0.45));display:block;}
.energy-line{width:100%;height:18px;background:#111c2a;border-radius:22px;overflow:hidden;margin:14px 0;}
.energy-fill{height:100%;width:100%;background:linear-gradient(90deg,#22ff66,#00d7ff);transition:0.2s;}
.btn{width:100%;border:none;cursor:pointer;border-radius:13px;padding:13px 14px;font-size:15px;font-weight:1000;color:#fff;text-align:center;text-transform:uppercase;margin-bottom:8px;}
.btn:active{transform:scale(0.97);}
.btn-purple{background:linear-gradient(180deg,#973dff,#5515a0);}
.btn-gold{background:linear-gradient(180deg,#ffd700,#a56b00);color:#111;}
.tap-effect{position:absolute;color:var(--gold);font-size:30px;font-weight:1000;pointer-events:none;animation:floatUp 0.9s forwards;z-index:1000;text-shadow:0 0 12px rgba(255,215,0,0.65);}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1);}100%{opacity:0;transform:translateY(-85px) scale(1.25);}}
.nav{position:fixed;left:0;bottom:0;width:100%;height:82px;background:rgba(6,11,18,0.96);display:grid;grid-template-columns:repeat(5,1fr);z-index:9999;backdrop-filter:blur(12px);}
.nav a{text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-weight:1000;font-size:11px;color:#8793a3;}
.nav a.active{color:var(--gold);}
@media(max-width:850px){
  .status{grid-template-columns:1fr 1fr;gap:8px;}
  .status-box{font-size:12px;padding:8px;}
  .bear-ring{width:200px;height:200px;}
}
</style>
</head>
<body>

<main class="page">
  <div class="top-bar">
    <a href="#" class="back">← Menyu</a>
    <div class="logo"><div class="bearbee">BEARBEE</div><div class="arena">CLICK</div></div>
  </div>

  <section class="status">
    <div class="status-box"><h3>Coin</h3>🪙 <span id="coinText">0</span></div>
    <div class="status-box"><h3>Enerji</h3>⚡ <span id="energyText">100</span>/100</div>
    <div class="status-box"><h3>Click Gücü</h3>🚀 <span id="boostText">1x</span></div>
    <div class="status-box"><h3>Ad Xal</h3>⭐ <span id="adPointText">0</span></div>
  </section>

  <section class="layout">
    <section class="panel click-panel">
      <h1 class="panel-title">Cyber Bear Click</h1>
      <div class="bear-ring" id="tapBear">
        <div class="bear-button">
          <img src="./assets/cyber-bear.png" alt="Cyber Bear" 
          onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
          <div class="bear-fallback">🐻</div>
        </div>
      </div>
      <div class="energy-line"><div class="energy-fill" id="energyFill"></div></div>
      <button class="btn btn-purple" id="energyAdBtn">🎥 REKLAMA BAX VƏ ENERJİNİ FULL ET</button>
      <div class="log" id="clickLog">Yükləndi. Klikləyin!</div>
    </section>
  </section>
</main>

<nav class="nav">
  <a href="#" class="active"><span class="icon">🐻</span>Click</a>
  <a href="#"><span class="icon">⛏️</span>Mining</a>
  <a href="#"><span class="icon">🛒</span>Market</a>
  <a href="#"><span class="icon">🏎️</span>Race</a>
  <a href="#"><span class="icon">💰</span>Wallet</a>
</nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Firebase config
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_AUTH_DOMAIN",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_STORAGE_BUCKET",
  messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
  appId: "YOUR_APP_ID"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const tg = window.Telegram?.WebApp;
if(tg) tg.expand();
const tgUser = tg?.initDataUnsafe?.user;
const userId = tgUser ? String(tgUser.id) : "demo_user";

let userData={coins:0,energy:100,boost:1,adPoints:0};
const coinText=document.getElementById("coinText");
const energyText=document.getElementById("energyText");
const boostText=document.getElementById("boostText");
const adPointText=document.getElementById("adPointText");
const energyFill=document.getElementById("energyFill");
const clickLog=document.getElementById("clickLog");

function updateUI(){
  coinText.innerText=userData.coins;
  energyText.innerText=userData.energy;
  boostText.innerText=userData.boost+"x";
  adPointText.innerText=userData.adPoints;
  energyFill.style.width=userData.energy+"%";
}

// Bear klik
document.getElementById("tapBear").addEventListener("click", async e=>{
  if(userData.energy<userData.boost){ clickLog.innerText="Kifayət qədər enerji yoxdur!"; return; }
  userData.energy-=userData.boost;
  userData.coins+=userData.boost;
  updateUI();
  const rect=e.currentTarget.getBoundingClientRect();
  const x=e.clientX-rect.left;
  const y=e.clientY-rect.top;
  const effect=document.createElement("div");
  effect.className="tap-effect";
  effect.style.left=x+"px";
  effect.style.top=y+"px";
  effect.innerText="+"+userData.boost;
  e.currentTarget.appendChild(effect);
  setTimeout(()=>effect.remove(),900);
});

// RichAds real popup
document.getElementById("energyAdBtn").addEventListener("click", ()=>{
  if(window.RichAdsPU){
    window.RichAdsPU.show({
      pubid:"1012853",
      siteid:"397995"
    }).then(async ()=>{
      userData.energy=100;
      updateUI();
      clickLog.innerText="Enerji tam bərpa olundu!";

      // Firebase-ə energy yüklə
      const userRef=doc(db,"users",userId);
      await updateDoc(userRef,{energy:userData.energy});
    }).catch(()=>{ clickLog.innerText="Reklam açılmadı!"; });
  }
});

// Avtomatik enerji bərpası
setInterval(()=>{if(userData.energy<100){userData.energy++;updateUI();}},4000);
updateUI();
</script>

<script src="https://richinfo.co/richpartners/pops/js/richads-pu-ob.js"
    data-pubid="1012853"
    data-siteid="397995"
    async
    data-cfasync="false"></script>

</body>
</html>
