<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* --- Firebase Konfiqurasiya --- */
const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_STORAGE_BUCKET",
    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
    appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* --- Telegram WebApp --- */
const tg = window.Telegram?.WebApp;
if(tg) tg.expand();
const tgUser = tg?.initDataUnsafe?.user;
const userId = tgUser ? String(tgUser.id) : "demo_user";

/* --- Oyun Dəyişənləri --- */
let userData = {
    coins: 0,
    energy: 100,
    boost: 1,
    adPoints: 0,
    lastBox2: 0,
    lastBox5: 0,
    lastBox10: 0
};
let pendingClicks = 0;

/* --- UI Elementləri --- */
const coinText = document.getElementById("coinText");
const energyText = document.getElementById("energyText");
const boostText = document.getElementById("boostText");
const adPointText = document.getElementById("adPointText");
const energyFill = document.getElementById("energyFill");
const clickLog = document.getElementById("clickLog");

/* --- UI Yeniləmə Funksiyası --- */
function updateUI(){
    coinText.innerText = userData.coins;
    energyText.innerText = userData.energy;
    boostText.innerText = userData.boost + "x";
    adPointText.innerText = userData.adPoints;
    energyFill.style.width = userData.energy + "%";
}

/* --- Firebase-dən məlumatları yükləmək --- */
async function loadUserData(){
    try{
        const userRef = doc(db,"users",userId);
        const userSnap = await getDoc(userRef);
        if(userSnap.exists()) userData = {...userData,...userSnap.data()};
        else await setDoc(userRef,userData);
        updateUI();
        checkTimers();
    }catch(err){
        console.log("Yükləmə xətası:",err);
    }
}

/* --- Klik effekti --- */
document.getElementById("tapBear").addEventListener("click",(e)=>{
    if(userData.energy<userData.boost) return;
    userData.energy-=userData.boost;
    userData.coins+=userData.boost;
    pendingClicks+=userData.boost;
    updateUI();

    const rect=e.currentTarget.getBoundingClientRect();
    const x=e.clientX-rect.left;
    const y=e.clientY-rect.top;
    const effect=document.createElement("div");
    effect.className="tap-effect";
    effect.style.left=x+"px";
    effect.style.top=y+"px";
    effect.innerText="+"+userData.boost;
    e.currentTarget.appendChild(effect);
    setTimeout(()=>effect.remove(),900);
});

/* --- Proqresi Firebase-ə yazmaq --- */
async function saveProgress(){
    if(pendingClicks===0) return;
    try{
        const userRef=doc(db,"users",userId);
        await updateDoc(userRef,{coins:userData.coins,energy:userData.energy});
        pendingClicks=0;
    }catch(err){
        console.log("Saxlama xətası:",err);
    }
}
document.getElementById("saveBtn").addEventListener("click",saveProgress);
document.getElementById("syncBtn").addEventListener("click",loadUserData);

/* --- RichAds Video Reklam --- */
document.getElementById("energyAdBtn").addEventListener("click", async () => {
    const adController = window.RichAds?.init({blockId: "SIZIN_BLOCK_ID"});
    if(!adController) return alert("Reklam hazır deyil!");
    try{
        await adController.show();
        userData.energy=100;
        updateUI();
        const userRef=doc(db,"users",userId);
        await updateDoc(userRef,{energy:100});
    }catch(err){
        console.log("Reklam tamamlanmadı:",err);
    }
});

/* --- Qutular və taymerlər --- */
function checkTimers(){
    setupBox(2,userData.lastBox2,2*60*1000,20);
    setupBox(5,userData.lastBox5,5*60*1000,60);
    setupBox(10,userData.lastBox10,10*60*1000,150);
}

function setupBox(minutes,lastTime,duration,reward){
    const btn=document.getElementById("boxBtn"+minutes);
    const timerText=document.getElementById("timer"+minutes);
    const nextTime=lastTime+duration;
    const now=Date.now();
    if(now>=nextTime){
        timerText.innerText="Hazırdır";
        btn.disabled=false;
        btn.onclick=()=>triggerBoxAd(minutes,reward);
    }else{
        btn.disabled=true;
        const diff=nextTime-now;
        const mins=Math.floor(diff/60000);
        const secs=Math.floor((diff%60000)/1000);
        timerText.innerText=`${mins}:${secs<10?'0':''}${secs}`;
    }
}

async function triggerBoxAd(minutes,reward){
    const now=Date.now();
    userData.coins+=reward;
    userData.adPoints+=reward;
    userData["lastBox"+minutes]=now;
    updateUI();
    const userRef=doc(db,"users",userId);
    const updateFields={coins:userData.coins,adPoints:userData.adPoints};
    updateFields["lastBox"+minutes]=now;
    await updateDoc(userRef,updateFields);
    checkTimers();
}

/* --- Enerjinin avtomatik bərpası --- */
setInterval(()=>{
    if(userData.energy<100) userData.energy++;
    updateUI();
},4000);

/* --- Taymerləri hər saniyə yenilə --- */
setInterval(checkTimers,1000);

/* --- Avtomatik arxa planda saxla --- */
setInterval(saveProgress,10000);

/* --- Başlanğıcda yüklə --- */
loadUserData();

</script>
