<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bearbee Arena | Click Room</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:#02060d;color:#fff;overflow-x:hidden;}
.page{max-width:500px;margin:0 auto;padding:12px;}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.back,.btn{padding:10px 12px;border-radius:10px;border:none;cursor:pointer;text-align:center;font-weight:800;}
.back{background:#08111c;color:#ffd700;}
.btn-purple{background:#973dff;color:#fff;}
.btn-gold{background:gold;color:#111;}
.status{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;}
.status-box{background:#08111c;border-radius:12px;padding:10px;text-align:center;}
.bear-ring{width:200px;height:200px;margin:12px auto;border-radius:50%;background:conic-gradient(#1597ff,#ffd700,#9b3dff,#1597ff);display:grid;place-items:center;cursor:pointer;}
.energy-line{width:100%;height:16px;background:#111c2a;border-radius:12px;margin:10px 0;}
.energy-fill{height:100%;width:100%;background:linear-gradient(90deg,#22ff66,#00d7ff);transition:0.2s;}
.box-card{background:#0d1928;border-radius:12px;padding:10px;text-align:center;margin-bottom:10px;}
.grid-3{display:grid;grid-template-columns:1fr;gap:10px;}
.nav{position:fixed;bottom:0;width:100%;height:60px;background:#06111a;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;text-align:center;}
.nav a{color:#8793a3;text-decoration:none;font-size:12px;}
.nav a.active{color:#ffd700;}
</style>
</head>
<body>

<main class="page">
<div class="top-bar">
  <a href="./index.html" class="back">← Menyu</a>
  <button class="btn btn-gold" id="syncBtn">Yenilə</button>
</div>

<section class="status">
  <div class="status-box">Coin<br>🪙<span id="coinText">0</span></div>
  <div class="status-box">Enerji<br>⚡<span id="energyText">100</span>/100</div>
  <div class="status-box">Click<br>🚀<span id="boostText">1x</span></div>
  <div class="status-box">Ad Xal<br>⭐<span id="adPointText">0</span></div>
</section>

<!-- Click panel bütün bölmələr üçün -->
<section class="click-panel" id="clickPanel">
  <div class="bear-ring" id="tapBear">🐻</div>
  <div class="energy-line"><div class="energy-fill" id="energyFill"></div></div>
  <button class="btn btn-purple" id="energyAdBtn">🎥 Reklama bax və Enerjini Full et</button>
  <button class="btn btn-gold" id="saveBtn">🪙 Xalları Bazada Saxla</button>
</section>

<section>
<h2>Reklamlı Qutular</h2>
<div class="grid-3">
<div class="box-card"><div>🎁</div><div>2 dəq qutu</div><button class="btn btn-purple" id="boxBtn2">Aç</button></div>
<div class="box-card"><div>📦</div><div>5 dəq qutu</div><button class="btn btn-purple" id="boxBtn5">Aç</button></div>
<div class="box-card"><div>💎</div><div>10 dəq qutu</div><button class="btn btn-purple" id="boxBtn10">Aç</button></div>
</div>
</section>
</main>

<nav class="nav">
<a href="#" class="active">🐻 Click</a>
<a href="#">⛏️ Mining</a>
<a href="#">🛒 Market</a>
<a href="#">🏎️ Race</a>
<a href="#">💰 Wallet</a>
</nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Firebase konfiqurasiyası
const firebaseConfig = {
  apiKey:"YOUR_API_KEY",
  authDomain:"YOUR_AUTH_DOMAIN",
  projectId:"YOUR_PROJECT_ID",
  storageBucket:"YOUR_STORAGE_BUCKET",
  messagingSenderId:"YOUR_MESSAGING_SENDER_ID",
  appId:"YOUR_APP_ID"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const tg = window.Telegram?.WebApp;
if(tg) tg.expand();
const userId = tg?.initDataUnsafe?.user?.id || crypto.randomUUID();

let userData={coins:0,energy:100,boost:1,adPoints:0,lastBox2:0,lastBox5:0,lastBox10:0};
let pendingClicks=0;

// UI elementləri
const coinText=document.getElementById("coinText");
const energyText=document.getElementById("energyText");
const boostText=document.getElementById("boostText");
const adPointText=document.getElementById("adPointText");
const energyFill=document.getElementById("energyFill");
const tapBear=document.getElementById("tapBear");
const saveBtn=document.getElementById("saveBtn");
const syncBtn=document.getElementById("syncBtn");

// UI yenilə
function updateUI(){
  coinText.innerText=userData.coins;
  energyText.innerText=userData.energy;
  boostText.innerText=userData.boost+"x";
  adPointText.innerText=userData.adPoints;
  energyFill.style.width=userData.energy+"%";
}

// Firebase-dən yüklə
async function loadUserData(){
  try{
    const userRef=doc(db,"users",userId);
    const snap=await getDoc(userRef);
    if(snap.exists()) userData={...userData,...snap.data()};
    else await setDoc(userRef,userData);
    updateUI();
    checkTimers();
  }catch(e){console.log(e);}
}

// Klik effekti və dərhal Firebase-ə yaz
function setupClickPanel(bearId, adBtnId, energyFillId, saveBtnId){
  const bear=document.getElementById(bearId);
  const adBtn=document.getElementById(adBtnId);
  const save=document.getElementById(saveBtnId);

  bear.addEventListener("click",()=>{
    if(userData.energy<userData.boost) return;
    userData.energy-=userData.boost;
    userData.coins+=userData.boost;
    pendingClicks+=userData.boost;
    updateUI();
    saveProgress();
  });

  adBtn.addEventListener("click", async()=>{
    const adController = window.RichAds?.init({blockId:"YOUR_BLOCK_ID"});
    if(!adController) return alert("Reklam hazır deyil!");
    try{
      await adController.show();
      userData.energy=100;
      updateUI();
      const userRef=doc(db,"users",userId);
      await updateDoc(userRef,{energy:100});
      saveProgress();
    }catch(e){console.log(e);}
  });

  save.addEventListener("click", saveProgress);
}

// Dərhal Firebase-ə yaz
async function saveProgress(){
  if(pendingClicks===0) return;
  try{
    const userRef=doc(db,"users",userId);
    await updateDoc(userRef,{coins:userData.coins,energy:userData.energy});
    pendingClicks=0;
  }catch(e){console.log(e);}
}

// Qutular
function checkTimers(){
  setupBox(2,userData.lastBox2,2*60*1000,20);
  setupBox(5,userData.lastBox5,5*60*1000,60);
  setupBox(10,userData.lastBox10,10*60*1000,150);
}
function setupBox(m,last,duration,reward){
  const btn=document.getElementById("boxBtn"+m);
  const now=Date.now();
  if(now>=last+duration){
    btn.disabled=false;
    btn.onclick=()=>triggerBoxAd(m,reward);
  }else{
    btn.disabled=true;
    setTimeout(()=>setupBox(m,last,duration,reward),1000);
  }
}
async function triggerBoxAd(m,reward){
  userData.coins+=reward;
  userData.adPoints+=reward;
  userData["lastBox"+m]=Date.now();
  updateUI();
  const userRef=doc(db,"users",userId);
  const upd={coins:userData.coins,adPoints:userData.adPoints};
  upd["lastBox"+m]=userData["lastBox"+m];
  await updateDoc(userRef,upd);
  checkTimers();
}

// Enerji bərpası
setInterval(()=>{if(userData.energy<100) userData.energy++; updateUI();},4000);
setInterval(saveProgress,10000);

// Setup Click panel (bütün bölmələr üçün, lazım olduqda ID-ləri dəyişin)
setupClickPanel("tapBear","energyAdBtn","energyFill","saveBtn");

loadUserData();
</script>

</body>
</html>
