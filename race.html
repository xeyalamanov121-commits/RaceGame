<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bearbee Arena | Multiplayer Turn Race</title>
<style>
:root{
--bg:#0b0f1a; --panel:#121927; --accent:#8b3cff; --gold:#ffd700; --green:#22ff66; --red:#ff2438;
}
body{margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:#fff;display:flex;flex-direction:column;min-height:100vh;}
.panel{background:var(--panel);margin:12px;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;}
.panel-title{color:var(--gold);font-weight:900;text-align:center;margin-bottom:8px;}
.track{position:relative;height:120px;background:rgba(255,255,255,0.05);border-radius:12px;overflow:hidden;margin-top:10px;}
.car{width:40px;height:40px;border-radius:8px;position:absolute;transition: left 0.2s linear;}
.finish{position:absolute;right:0;top:0;width:5px;height:100%;background:red;}
.copy-btn{background:linear-gradient(180deg,#8b3cff,#5a00ff);border:none;color:#fff;padding:12px;border-radius:10px;width:100%;cursor:pointer;margin-top:4px;font-weight:700;}
.copy-btn:disabled{background:#333;color:#666;cursor:not-allowed;}
.status-box{padding:8px;border-radius:10px;background:rgba(139,60,255,0.1);text-align:center;font-weight:900;}
input[type=text]{width:100%;padding:10px;border-radius:8px;border:none;margin-top:4px;background:rgba(255,255,255,0.1);color:#fff;box-sizing:border-box;}
</style>
</head>
<body>

<div class="panel">
<div class="panel-title">🏎️ Multiplayer Turn-Based Race</div>
<input type="text" id="roomInput" placeholder="Oda Kodu">
<button class="copy-btn" id="createBtn">Yeni Oda Yarat</button>
<button class="copy-btn" id="joinBtn">Qatıl</button>
<div class="status-box" id="raceStatus">Odaya qoşulmayıb</div>
<button class="copy-btn" id="readyBtn" disabled>Hazır Ol</button>
<button class="copy-btn" id="startBtn" disabled>Yarışı Başlat</button>
<button class="copy-btn" id="clickBtn" disabled>⚡ QAC (KLİK)</button>

<div class="track" id="track">
<div class="car" id="playerCar" style="background:#22ff66;top:10px;left:0;"></div>
<div class="car" id="opponentCar" style="background:#ff2438;top:60px;left:0;"></div>
<div class="finish"></div>
</div>
</div>

<script type="module">
// 1. CDN URL-lərdən import et - bu sənin xətanı düzəldir
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, update, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// 2. Sənin göndərdiyin config
const firebaseConfig = {
  apiKey: "AIzaSyCnbIgRIgQn7rO06epoPnHKYlzpE8wQJIQ",
  authDomain: "racegane.firebaseapp.com",
  databaseURL: "https://racegane-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "racegane",
  storageBucket: "racegane.firebasestorage.app",
  messagingSenderId: "477893876737",
  appId: "1:477893876737:web:1b561bb3224b0086c63400"
};

const app = initializeApp(firebaseConfig);
const rdb = getDatabase(app);

const myId = "user_" + Math.floor(Math.random()*10000);
let roomCode = null;
let isMyTurn = false;
let gameStarted = false;
let playerPos = 0, opponentPos = 0;
let roomData = null;

const playerCar = document.getElementById("playerCar");
const opponentCar = document.getElementById("opponentCar");
const clickBtn = document.getElementById("clickBtn");
const startBtn = document.getElementById("startBtn");
const readyBtn = document.getElementById("readyBtn");
const raceStatus = document.getElementById("raceStatus");
const track = document.getElementById("track");

function getTrackWidth() {
  return track.offsetWidth - 45;
}

function getOpponentId() {
  if (!roomData ||!roomData.players) return null;
  return Object.keys(roomData.players).find(id => id!== myId);
}

let unsubscribe = null;
function listenRoom() {
  if (unsubscribe) unsubscribe();
  const roomRef = ref(rdb, `rooms/${roomCode}`);
  unsubscribe = onValue(roomRef, snap => {
    if (!snap.exists()) {
      raceStatus.innerText = "Oda silindi və ya tapılmadı";
      return;
    }
    roomData = snap.val();
    
    isMyTurn = roomData.turn === myId;
    gameStarted = roomData.started || false;
    
    playerPos = roomData.players[myId] || 0;
    const oppId = getOpponentId();
    opponentPos = oppId? (roomData.players[oppId] || 0) : 0;
    
    playerCar.style.left = playerPos + "px";
    opponentCar.style.left = opponentPos + "px";
    
    clickBtn.disabled =!isMyTurn ||!gameStarted;
    startBtn.disabled =!roomData.players || Object.keys(roomData.players).length < 2 || gameStarted;
    
    if (gameStarted) {
      raceStatus.innerText = isMyTurn? "Sənin növbəndir! Kliklə" : "Rəqibin növbəsidir...";
    } else {
      raceStatus.innerText = `Oda: ${roomCode}. ${Object.keys(roomData.players).length}/2 oyunçu`;
    }
    
    checkFinish();
  });
}

document.getElementById("createBtn").onclick = async () => {
  roomCode = document.getElementById("roomInput").value || ("ROOM" + Math.floor(Math.random()*1000));
  document.getElementById("roomInput").value = roomCode;
  await set(ref(rdb, `rooms/${roomCode}`), { turn: myId, started: false, players: { [myId]: 0 } });
  raceStatus.innerText = `Oda yaradıldı: ${roomCode}. Rəqib gözlənilir...`;
  readyBtn.disabled = false;
  listenRoom();
};

document.getElementById("joinBtn").onclick = async () => {
  roomCode = document.getElementById("roomInput").value;
  if (!roomCode) return alert("Oda kodu yaz");
  
  const snap = await get(ref(rdb, `rooms/${roomCode}`));
  if (!snap.exists()) return alert("Oda tapılmadı");
  if (Object.keys(snap.val().players || {}).length >= 2) return alert("Oda doludur");
  
  await update(ref(rdb, `rooms/${roomCode}/players`), { [myId]: 0 });
  raceStatus.innerText = "Odaya qoşuldun. Hazır ol";
  readyBtn.disabled = false;
  listenRoom();
};

readyBtn.onclick = async () => {
  await update(ref(rdb, `rooms/${roomCode}/players/${myId}`), 0);
  raceStatus.innerText = "Hazırsan. Yarışın başlamasını gözlə";
};

startBtn.onclick = async () => {
  await update(ref(rdb, `rooms/${roomCode}`), { started: true });
};

clickBtn.onclick = async () => {
  if (!isMyTurn ||!gameStarted) return;
  
  const newPos = playerPos + 25;
  const oppId = getOpponentId();
  if (!oppId) return alert("Rəqib yoxdur");
  
  await set(ref(rdb, `rooms/${roomCode}/players/${myId}`), newPos);
  await update(ref(rdb, `rooms/${roomCode}`), { turn: oppId });
};

function checkFinish() {
  const finish = getTrackWidth();
  if (playerPos >= finish) {
    alert("Qalib: Sən! 🏆");
    clickBtn.disabled = true;
    setTimeout(() => set(ref(rdb, `rooms/${roomCode}`), null), 2000);
  }
  if (opponentPos >= finish) {
    alert("Qalib: Rəqib 😢");
    clickBtn.disabled = true;
  }
}
</script>
</body>
</html>
