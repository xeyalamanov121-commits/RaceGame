<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
body { font-family: Arial; padding: 20px; }
h2 { margin-bottom: 20px; }
table { border-collapse: collapse; width: 100%; }
th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
th { background: #f2f2f2; }
</style>
</head>
<body>

<h2>Admin Dashboard (Firebase-only)</h2>

<table id="statsTable">
<thead>
<tr><th>İstifadəçi</th><th>Token Balansı</th><th>Əməliyyat Sayı</th></tr>
</thead>
<tbody></tbody>
</table>

<script>
// Admin Telegram ID yoxlaması
const adminId = "8591374417";
const userId = prompt("Telegram ID-ni daxil et:");
if(userId !== adminId){
  document.body.innerHTML = "<h2>Access Denied</h2>";
  throw new Error("Not admin");
}

// Firebase konfiqurasiyası
var firebaseConfig = {
  apiKey: "AIzaSyCnbIgRIgQn7rO06epoPnHKYlzpE8wQJIQ",
  authDomain: "racegane.firebaseapp.com",
  databaseURL: "https://racegane-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "racegane",
  storageBucket: "racegane.firebasestorage.app",
  messagingSenderId: "477893876737",
  appId: "1:477893876737:web:1b561bb3224b0086c63400"
};

firebase.initializeApp(firebaseConfig);
var db = firebase.database();
var tbody = document.querySelector("#statsTable tbody");

// Realtime Database-dən istifadəçiləri çəkmək
db.ref("users").on("value", function(snapshot){
  tbody.innerHTML = "";
  var users = snapshot.val();
  for(var uid in users){
    var user = users[uid];
    var transactions = user.transactions ? user.transactions.length : 0;
    var row = "<tr><td>"+user.username+"</td><td>"+(user.balance||0)+"</td><td>"+transactions+"</td></tr>";
    tbody.innerHTML += row;
  }
});
</script>

</body>
</html>
