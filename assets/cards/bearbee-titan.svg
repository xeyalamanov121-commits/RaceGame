  <rect x="22" y="22" width="856" height="576" rx="34" fill="none" stroke="url(#border)" stroke-width="10"/>
  <circle cx="450" cy="278" r="155" fill="#05080f" stroke="url(#border)" stroke-width="12" filter="url(#glow)"/>
  <text x="450" y="310" text-anchor="middle" font-size="128" font-family="Arial, sans-serif">🐻</text>
  <text x="450" y="78" text-anchor="middle" fill="#ffffff" font-size="48" font-family="Arial, sans-serif" font-weight="900" letter-spacing="3">Bearbee Titan</text>
  <rect x="285" y="448" width="330" height="70" rx="22" fill="#000000" fill-opacity="0.52" stroke="url(#border)" stroke-width="4"/>
  <text x="450" y="493" text-anchor="middle" fill="#ffd700" font-size="34" font-family="Arial, sans-serif" font-weight="900">POWER 220</text>
  <text x="450" y="560" text-anchor="middle" fill="#ffd700" font-size="30" font-family="Arial, sans-serif" font-weight="900">LEGENDARY</text>
